<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네온 함대 — 보스 페이즈 평가표</title>
<style>
  :root { --bg:#0b1017; --card:#131c27; --line:#2a3a4d; --tx:#e6eef8; --dim:#8ea3bd;
          --cy:#3ff5e0; --warn:#ff6b6b; --ok:#5ce08a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font-size:15px; line-height:1.5;
         font-family:"Malgun Gothic","맑은 고딕",Pretendard,system-ui,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:16px 14px 90px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:14px; }
  .sub b { color:var(--cy); }

  .phases { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:12px 0 18px; }
  .phases div { background:var(--card); border:1px solid var(--line); border-radius:7px; padding:8px 9px; }
  .phases b { display:block; font-size:13px; color:var(--cy); margin-bottom:2px; }
  .phases span { font-size:12px; color:var(--dim); }
  @media (max-width:560px){ .phases { grid-template-columns:1fr; } }

  h2 { font-size:15px; margin:22px 0 8px; padding:6px 10px; background:#1b2735;
       border-left:3px solid var(--cy); border-radius:0 5px 5px 0; }
  .note { background:#10251c; border:1px solid #235c3f; border-radius:6px;
          padding:9px 11px; font-size:13px; color:#bfe6cf; margin:0 0 12px; }
  .note.warn { background:#2a1416; border-color:#6b2b2f; color:#f3c9cc; }

  .q { background:var(--card); border:1px solid var(--line); border-radius:8px;
       padding:11px 12px; margin-bottom:9px; }
  .q .t { font-weight:700; font-size:14.5px; }
  .q .h { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .opts { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
  .opts label { display:inline-flex; align-items:center; gap:5px; cursor:pointer;
    background:#0e1620; border:1px solid var(--line); border-radius:20px;
    padding:5px 11px; font-size:13.5px; user-select:none; }
  .opts label:hover { border-color:var(--cy); }
  .opts input { accent-color:var(--cy); margin:0; }
  .opts input:checked + span { color:var(--cy); font-weight:700; }
  textarea { width:100%; margin-top:8px; background:#0e1620; color:var(--tx);
    border:1px solid var(--line); border-radius:6px; padding:7px 9px;
    font:inherit; font-size:13.5px; resize:vertical; min-height:38px; }
  textarea:focus, .opts label:focus-within { outline:2px solid var(--cy); outline-offset:1px; }

  .nums { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:8px; }
  .nums label { font-size:13px; color:var(--dim); }
  .nums input { width:100%; margin-top:3px; background:#0e1620; color:var(--tx);
    border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }

  .bar { position:fixed; left:0; right:0; bottom:0; background:#0e1620ee; backdrop-filter:blur(6px);
    border-top:1px solid var(--line); padding:10px 14px; display:flex; gap:8px; align-items:center; }
  .bar .prog { flex:1; font-size:13px; color:var(--dim); }
  button { background:var(--cy); color:#04121a; border:0; border-radius:7px;
    padding:10px 16px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line); font-weight:400; }
  button:active { transform:translateY(1px); }
  .saved { color:var(--ok); font-size:12.5px; }
  @media print { .bar { display:none; } body { background:#fff; color:#000; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>보스 페이즈 평가표 <span style="font-size:13px;color:#8ea3bd">§G-47</span></h1>
  <div class="sub">
    대상 = <b>섹터 1 보스 B8</b> · 나머지 9종은 종전 그대로 · 배포 <b>b57d596</b><br>
    체크하면 자동 저장됩니다. 다 하시고 <b>맨 아래 “결과 복사”</b>를 눌러 붙여넣어 주세요.
  </div>

  <div class="phases">
    <div><b>1단계 · 100~66%</b><span>부채꼴(크레센트)</span></div>
    <div><b>2단계 · 66~33%</b><span>부채꼴 + 전방위 교대</span></div>
    <div><b>3단계 · 33~0%</b><span>전방위 + 나선 · 발사 1.7배</span></div>
  </div>

  <div id="form"></div>

  <h2>바꿀 수치 (있으면만)</h2>
  <div class="q">
    <div class="nums">
      <label>임계 ① (기본 66%)<input id="n1" placeholder="예: 70"></label>
      <label>임계 ② (기본 33%)<input id="n2" placeholder="예: 30"></label>
      <label>3단계 발사 배수 (기본 1.7)<input id="n3" placeholder="예: 1.4"></label>
      <label>전환 무적 (기본 0.4초)<input id="n4" placeholder="예: 0.3"></label>
    </div>
    <textarea id="n5" placeholder="그 밖에 하고 싶은 말"></textarea>
  </div>
</div>

<div class="bar">
  <span class="prog" id="prog">0 / 12</span>
  <span class="saved" id="saved"></span>
  <button class="ghost" id="reset">초기화</button>
  <button id="copy">결과 복사</button>
</div>

<script>
//  평가 항목. 인쇄본(docs/pilot/보스페이즈-평가표.html)과 **같은 내용**이다 — 한쪽만 고치지 말 것.
const SECTIONS = [
  { h: 'A. 전환이 느껴지는가', note:
    '전환 순간에 후광 + 화면 플래시 + 3D 파편이 터지고 0.4초 무적이 걸립니다. ' +
    '⚠️예전 광폭화(체력 50%)는 아무 신호가 없어 변화를 인지조차 못 했습니다 — 그게 이번 작업의 이유입니다.',
    qs: [
      { t: '2단계 전환(66%)을 알아챘는가', h: '화면을 안 보고 있어도 느껴졌는지', o: ['확실히','그런가보다','전혀 모름'] },
      { t: '3단계 전환(33%)을 알아챘는가', o: ['확실히','그런가보다','전혀 모름'] },
      { t: '전환 연출이 과한가 / 약한가', h: '파편·플래시 세기', o: ['적당','과함','약함'] },
      { t: '0.4초 무적이 답답한가', h: '그 순간 보스에게 피해가 안 들어갑니다', o: ['못 느낌','적당','답답함'] },
    ] },
  { h: 'B. 공격이 실제로 달라지는가', note:
    '지루함의 원인이 해소됐는지 봅니다. 전에는 광폭화해도 같은 공격을 빨리 할 뿐이었습니다.',
    qs: [
      { t: '2단계에서 대응이 달라졌는가', h: '부채꼴만 피하던 방식이 안 통하는지', o: ['달라짐','비슷','똑같음'] },
      { t: '3단계가 확실히 다른가', o: ['다름','비슷','똑같음'] },
      { t: '⚠️탄이 과밀해 피할 곳이 없는 순간이 있었나', h: '두 패턴이 겹칠 때 — 가장 큰 위험', o: ['없음','가끔','자주(문제)'], warn: 1 },
      { t: '전보다 덜 지루한가', h: '이번 작업의 목적', o: ['확실히','조금','그대로'] },
    ] },
  { h: 'C. 난이도', qs: [
      { t: '3단계 발사 1.7배가 감당되는가', o: ['적당','너무 빠름','더 빨라도 됨'] },
      { t: '임계 66% / 33% 가 적절한가', h: '너무 이르거나 늦은 느낌', o: ['적당','조정 필요'] },
      { t: '보스전 길이가 변했는가', h: '수치상 총량은 그대로 뒀습니다', o: ['그대로','길어짐','짧아짐'] },
      { t: '버그·이상 동작', h: '탄이 안 나옴 · 연출 끊김 · 프레임 하락 등', o: ['없음','있음'] },
    ] },
  { h: 'D. 결론 — 다음에 무엇을 할지', note:
    '⚠️“되돌림”도 선택지입니다. 표에서 B8 한 줄만 빼면 즉시 원상복구됩니다.',
    qs: [
      { t: '결론', o: ['확대(9종에도 적용)','조절 후 확대','B8만 유지','되돌림'] },
    ] },
];

const KEY = 'nf-g47-eval';
const root = document.getElementById('form');
let idx = 0;
for (const s of SECTIONS) {
  const h = document.createElement('h2'); h.textContent = s.h; root.appendChild(h);
  if (s.note) { const n = document.createElement('div');
    n.className = 'note' + (s.h.startsWith('D') ? ' warn' : ''); n.textContent = s.note; root.appendChild(n); }
  for (const q of s.qs) {
    const i = idx++;
    const d = document.createElement('div'); d.className = 'q';
    d.innerHTML = `<div class="t">${q.t}</div>${q.h ? `<div class="h">${q.h}</div>` : ''}`;
    const opts = document.createElement('div'); opts.className = 'opts';
    q.o.forEach((o, k) => {
      const l = document.createElement('label');
      l.innerHTML = `<input type="radio" name="q${i}" value="${o}"><span>${o}</span>`;
      opts.appendChild(l);
    });
    d.appendChild(opts);
    const ta = document.createElement('textarea');
    ta.placeholder = '느낀 대로 (선택)'; ta.dataset.memo = i;
    d.appendChild(ta);
    root.appendChild(d);
    d.dataset.q = i; d.dataset.label = q.t;
  }
}
const TOTAL = idx;

//  ⚠️자동 저장. 플레이 도중 새로고침·탭 전환으로 답이 날아가면 다시 시킬 수 없다.
const save = () => {
  const d = { r: {}, m: {}, n: {} };
  document.querySelectorAll('input[type=radio]:checked').forEach(x => d.r[x.name] = x.value);
  document.querySelectorAll('textarea[data-memo]').forEach(x => { if (x.value.trim()) d.m[x.dataset.memo] = x.value; });
  ['n1','n2','n3','n4','n5'].forEach(k => { const v = document.getElementById(k).value.trim(); if (v) d.n[k] = v; });
  try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
  const done = Object.keys(d.r).length;
  document.getElementById('prog').textContent = `${done} / ${TOTAL}` + (done === TOTAL ? ' — 다 됐습니다' : '');
  const s = document.getElementById('saved'); s.textContent = '저장됨';
  clearTimeout(save._t); save._t = setTimeout(() => s.textContent = '', 1200);
};
const load = () => {
  let d; try { d = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return; }
  Object.entries(d.r || {}).forEach(([n, v]) => {
    const el = document.querySelector(`input[name="${n}"][value="${CSS.escape(v)}"]`); if (el) el.checked = true;
  });
  Object.entries(d.m || {}).forEach(([i, v]) => {
    const el = document.querySelector(`textarea[data-memo="${i}"]`); if (el) el.value = v;
  });
  Object.entries(d.n || {}).forEach(([k, v]) => { const el = document.getElementById(k); if (el) el.value = v; });
  const done = Object.keys(d.r || {}).length;
  document.getElementById('prog').textContent = `${done} / ${TOTAL}`;
};
document.addEventListener('change', save);
document.addEventListener('input', save);
load();

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('적은 내용을 모두 지웁니다. 계속할까요?')) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  location.reload();
});

//  결과를 **붙여넣기 좋은 텍스트**로 만든다 — 그대로 클로드에게 주면 된다.
document.getElementById('copy').addEventListener('click', async () => {
  const lines = ['# 보스 페이즈 평가 결과 (§G-47 · B8)', ''];
  let sec = -1, n = 0;
  for (const s of SECTIONS) {
    lines.push('## ' + s.h);
    for (const q of s.qs) {
      const i = n++;
      const r = document.querySelector(`input[name="q${i}"]:checked`);
      const m = document.querySelector(`textarea[data-memo="${i}"]`).value.trim();
      lines.push(`- ${q.t}: ${r ? r.value : '(미응답)'}${m ? ' — ' + m : ''}`);
    }
    lines.push('');
  }
  const nums = [['임계①','n1'],['임계②','n2'],['3단계 발사 배수','n3'],['전환 무적','n4']]
    .map(([l, k]) => { const v = document.getElementById(k).value.trim(); return v ? `${l}=${v}` : null; })
    .filter(Boolean);
  const etc = document.getElementById('n5').value.trim();
  if (nums.length || etc) {
    lines.push('## 바꿀 수치');
    if (nums.length) lines.push('- ' + nums.join(' · '));
    if (etc) lines.push('- ' + etc);
  }
  const text = lines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    alert('복사했습니다. 클로드에게 그대로 붙여넣어 주세요.');
  } catch (e) {
    //  ⚠️클립보드 권한이 없거나 비보안 컨텍스트면 실패한다 — 그때는 선택 가능한 창을 띄운다.
    const w = window.open('', '_blank');
    if (w) { w.document.write('<pre style="white-space:pre-wrap;font:14px monospace;padding:16px">'
      + text.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;') + '</pre>'); w.document.close(); }
    else alert('복사에 실패했습니다. 화면을 직접 선택해 복사해 주세요.');
  }
});
</script>
</body>
</html>
